<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 320" role="img" aria-label="Five step order fulfillment pipeline from order placed to delivered"><title>Five step order fulfillment pipeline from order placed to delivered</title><rect width="100%" height="100%" fill="#f9fafb"/><text x="300" y="34" text-anchor="middle" font-family="sans-serif" font-size="20" font-weight="bold" fill="#0f2d3d">Order fulfillment pipeline</text><rect x="150" y="62" width="300" height="36" rx="18" fill="#4e9a8f"/><text x="300" y="86" text-anchor="middle" font-family="sans-serif" font-size="16" fill="#ffffff">1. Order placed</text><rect x="150" y="112" width="300" height="36" rx="18" fill="#3b82c4"/><text x="300" y="136" text-anchor="middle" font-family="sans-serif" font-size="16" fill="#ffffff">2. Payment cleared</text><rect x="150" y="162" width="300" height="36" rx="18" fill="#4e9a8f"/><text x="300" y="186" text-anchor="middle" font-family="sans-serif" font-size="16" fill="#ffffff">3. Picked & packed</text><rect x="150" y="212" width="300" height="36" rx="18" fill="#3b82c4"/><text x="300" y="236" text-anchor="middle" font-family="sans-serif" font-size="16" fill="#ffffff">4. Shipped</text><rect x="150" y="262" width="300" height="36" rx="18" fill="#b23a48"/><text x="300" y="286" text-anchor="middle" font-family="sans-serif" font-size="16" fill="#ffffff">5. Delivered</text></svg>