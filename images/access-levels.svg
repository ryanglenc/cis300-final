<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 320" role="img" aria-label="Three access levels: owner, manager and staff"><title>Three access levels: owner, manager and staff</title><rect width="100%" height="100%" fill="#f9fafb"/><text x="300" y="34" text-anchor="middle" font-family="sans-serif" font-size="20" font-weight="bold" fill="#0f2d3d">Role-based access levels</text><rect x="90" y="70" width="420" height="56" rx="10" fill="#b23a48"/><text x="110" y="95" font-family="sans-serif" font-size="18" font-weight="bold" fill="#fff">Owner</text><text x="110" y="115" font-family="sans-serif" font-size="14" fill="#fff">Everything, including users</text><rect x="90" y="140" width="420" height="56" rx="10" fill="#3b82c4"/><text x="110" y="165" font-family="sans-serif" font-size="18" font-weight="bold" fill="#fff">Manager</text><text x="110" y="185" font-family="sans-serif" font-size="14" fill="#fff">Sales, fulfillment, subscriptions</text><rect x="90" y="210" width="420" height="56" rx="10" fill="#4e9a8f"/><text x="110" y="235" font-family="sans-serif" font-size="18" font-weight="bold" fill="#fff">Staff</text><text x="110" y="255" font-family="sans-serif" font-size="14" fill="#fff">Fulfillment tasks only</text></svg>